; cnc-ddraw configuration for Kid Pix Deluxe 3
;
; The game draws a fixed 800x600 16-bit canvas through DirectDraw. cnc-ddraw
; replaces the 2000-era DirectDraw path and scales that canvas up.

[ddraw]

; A normal bordered window for now: it activates like any app (the engine
; only escalates its display when its window is active), and it is easy to
; see whether anything renders. 1200x900 is 1.5x and fits the screen whether
; or not Windows applies DPI scaling to the window.
fullscreen=false
windowed=true
border=true
resizable=true
width=800
height=600

; Keep the 4:3 shape; scale the mouse to match.
maintas=false
boxing=false
adjmouse=true

; The engine asks for DDSCL_NORMAL without fullscreen. Without fake_mode,
; cnc-ddraw sizes its surfaces from the window's current client rect, which is
; not yet 800x600 at that point in startup.
fake_mode=800x600x16

; GDI, not OpenGL: Kid Pix creates its own OpenGL context on the same window
; and skips its own pixel-format selection if one is already set, which the
; OpenGL renderer does first. cnc-ddraw's presets for Broderbund-era kids'
; titles all use gdi. (Shaders need OpenGL, so none for now.)
renderer=gdi
;shader=Shaders\interpolation\catmull-rom-bilinear.glsl

nonexclusive=true
; -2 = force full redraws; helps when menus or loading screens do not appear
minfps=-2
maxfps=-1
vsync=false
; default true: pins the game to one CPU core. Set false if sound stutters.
singlecpu=true

; Do not let cnc-ddraw rewrite this file with its own values.
savesettings=0
devmode=false
no_compat_warning=true
hook=4
fixchilds=0

[configit]
; configit.dll, the Kid Pix compatibility shim, reads this section; cnc-ddraw ignores it.

; Log to configit.log in this folder (started afresh each launch):
; 0 = no log (default), 1 = startup lines and errors, 2 = also detailed traces.
log=0

; The game's menu bar: pinned = always shown (default),
; auto = hidden until you click the top edge or press Alt, as originally,
; off = leave the game's own menu bar code alone.
menubar=pinned
